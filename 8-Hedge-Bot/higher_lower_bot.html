<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Deriv Higher/Lower Web Bot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111;
            color: #0f0;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        input,
        textarea {
            width: 100%;
            margin: 4px 0;
            padding: 10px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 24px;
            margin: 10px 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-start {
            background: #00ff88;
            color: #000;
        }

        .btn-start:hover {
            background: #00cc6e;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .btn-stop {
            background: #ff4444;
            color: #fff;
        }

        .btn-stop:hover {
            background: #cc3333;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.4);
        }

        pre {
            background: #000;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid #333;
            line-height: 1.4;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #00ff88;
        }

        .config-box {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #aaa;
        }

        h2 {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            text-align: center;
            font-size: 28px;
        }

        .note {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .badge {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-size: 10px;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🚀 Deriv Higher/Lower Web Bot</h2>

        <div class="config-box">
            <label>APP_ID:</label>
            <input id="app_id" value="118515">

            <label>API_TOKEN:</label>
            <input id="api_token" value="BwDAE6dzfr7FOak">

            <label>SYMBOL:</label>
            <input id="symbol" value="R_10">

            <label>STAKE:</label>
            <input id="stake" value="0.35" type="number" step="0.01">

            <label>BARRIER (e.g. +0.1 or -0.1):</label>
            <input id="barrier" value="+0.1" placeholder="e.g. +0.5">
            <div class="note">💡 Use <b>+</b> for offset above or <b>-</b> for offset below current price.</div>

            <label>DURATION (ticks):</label>
            <input id="duration" value="5" type="number">

            <label>TRADE_INTERVAL (ms):</label>
            <input id="trade_interval" value="2000" type="number">

            <label>MAX_TOTAL_STAKE:</label>
            <input id="max_total_stake" value="9.5" type="number" step="0.01">

            <label>TRADE_PATTERN (comma separated):</label>
            <input id="pattern" value="" placeholder="e.g. HIGHER, LOWER, HIGHER">
            <div class="note">💡 Leave empty for <b>BOTH</b> Higher/Lower trades simultaneously.</div>
        </div>

        <div style="text-align: center;">
            <button class="btn-start" onclick="startBot()">▶ Start Bot</button>
            <button class="btn-stop" onclick="stopBot()">⏹ Stop Bot</button>
        </div>

        <h3>📜 Bot Log</h3>
        <pre id="log"></pre>
    </div>

    <script>
        const logBox = document.getElementById("log");

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.textContent += `[${time}] ${msg}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function startBot() {
            logBox.textContent = ""; // Clear log on start
            log("▶ Starting bot...");
            const config = {
                APP_ID: document.getElementById("app_id").value,
                API_TOKEN: document.getElementById("api_token").value,
                SYMBOL: document.getElementById("symbol").value,
                STAKE: parseFloat(document.getElementById("stake").value),
                BARRIER: document.getElementById("barrier").value,
                DURATION: parseInt(document.getElementById("duration").value),
                TRADE_INTERVAL: parseInt(document.getElementById("trade_interval").value),
                MAX_TOTAL_STAKE: parseFloat(document.getElementById("max_total_stake").value),
                TRADE_PATTERN: document.getElementById("pattern").value.split(",").map(p => p.trim().toUpperCase()).filter(p => p !== ""),
            };

            try {
                const response = await fetch("/start", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(config),
                });
                const result = await response.text();
                log(result);
            } catch (err) {
                log("❌ Error connecting to server: " + err.message);
            }
        }

        async function stopBot() {
            log("⏹ Stopping bot...");
            try {
                const response = await fetch("/stop");
                const result = await response.text();
                log(result);
            } catch (err) {
                log("❌ Error stopping bot: " + err.message);
            }
        }

        const evtSource = new EventSource("/logs");
        evtSource.onmessage = (event) => log(event.data);
        evtSource.onerror = () => {
            // Optional: handle reconnection or logging
        };
    </script>
</body>

</html>
