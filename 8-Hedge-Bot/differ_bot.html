<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Deriv 4-Consecutive Differ Bot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111;
            color: #0f0;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        input {
            width: 100%;
            margin: 6px 0;
            padding: 12px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }

        .btn-start {
            background: linear-gradient(135deg, #00ff88, #00cc6e);
            color: #000;
        }

        .btn-start:hover {
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            transform: translateY(-2px);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ff4444, #cc3333);
            color: #fff;
        }

        .btn-stop:hover {
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.4);
            transform: translateY(-2px);
        }

        pre {
            background: #000;
            padding: 20px;
            height: 500px;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #222;
            line-height: 1.5;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #00ff88;
            margin-top: 0;
        }

        .config-card {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h2 {
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
            text-align: center;
            font-size: 24px;
            margin-top: 0;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .badge {
            background: #222;
            padding: 4px 10px;
            border-radius: 20px;
            color: #aaa;
            font-size: 11px;
            border: 1px solid #333;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="dashboard">
            <div class="config-card">
                <h2>⚡ Bot Settings</h2>

                <label>APP_ID</label>
                <input id="app_id" value="118515">

                <label>API_TOKEN</label>
                <input id="api_token" type="password" value="BwDAE6dzfr7FOak">

                <label>SYMBOL</label>
                <input id="symbol" value="R_10">

                <label>BASE STAKE ($)</label>
                <input id="stake" value="0.35" type="number" step="0.01">

                <label>TAKE PROFIT ($)</label>
                <input id="take_profit" value="10.00" type="number" step="0.01">

                <label>STOP LOSS ($)</label>
                <input id="stop_loss" value="50.00" type="number" step="0.01">

                <label>CONSECUTIVE PATTERN (e.g. 2, 3, 4)</label>
                <input id="pattern_count" value="4" type="number" min="1">

                <div style="margin-top: 30px;">
                    <button id="startBtn" class="btn-start" onclick="startBot()">▶ Launch Bot</button>
                    <button id="stopBtn" class="btn-stop" onclick="stopBot()">⏹ Terminate Bot</button>
                </div>
            </div>

            <div>
                <div class="status-header">
                    <h3 style="margin: 0; color: #fff;">📜 Live Execution Log</h3>
                    <span id="statusBadge" class="badge">OFFLINE</span>
                </div>
                <pre id="log"></pre>
            </div>
        </div>
    </div>

    <script>
        const logBox = document.getElementById("log");
        const statusBadge = document.getElementById("statusBadge");

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.textContent += `[${time}] ${msg}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function startBot() {
            logBox.textContent = "";
            log("🚀 Initializing bot sequence...");

            const config = {
                APP_ID: document.getElementById("app_id").value,
                API_TOKEN: document.getElementById("api_token").value,
                SYMBOL: document.getElementById("symbol").value,
                STAKE: parseFloat(document.getElementById("stake").value),
                TAKE_PROFIT: parseFloat(document.getElementById("take_profit").value),
                STOP_LOSS: parseFloat(document.getElementById("stop_loss").value),
                PATTERN_COUNT: parseInt(document.getElementById("pattern_count").value),
            };

            try {
                const response = await fetch("/start", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(config),
                });
                const result = await response.text();
                log(result);
                statusBadge.textContent = "RUNNING";
                statusBadge.style.color = "#00ff88";
                statusBadge.style.borderColor = "#00ff88";
            } catch (err) {
                log("❌ Initialization Failed: " + err.message);
            }
        }

        async function stopBot() {
            log("🛑 Sending termination signal...");
            try {
                const response = await fetch("/stop");
                const result = await response.text();
                log(result);
                statusBadge.textContent = "STOPPED";
                statusBadge.style.color = "#ff4444";
                statusBadge.style.borderColor = "#ff4444";
            } catch (err) {
                log("❌ Termination Failed: " + err.message);
            }
        }

        const evtSource = new EventSource("/logs");
        evtSource.onmessage = (event) => log(event.data);
        evtSource.onerror = () => {
            // Reconnect handled by browser
        };
    </script>
</body>

</html>
